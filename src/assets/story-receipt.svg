<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Biên nhận đặt cọc loa mô phỏng</title>
  <desc id="desc">Vy đã thanh toán khoản cọc 200.000 đồng lúc 11 giờ 26.</desc>
  <rect width="480" height="320" rx="22" fill="#f8f5eb"/>
  <rect x="22" y="20" width="436" height="280" rx="13" fill="#fff" stroke="#ded9c9"/>
  <path d="M46 77h388" stroke="#e8e4d9" stroke-width="2"/>
  <circle cx="66" cy="50" r="16" fill="#dfe8d8"/>
  <path d="M57 52h18M66 43v18" stroke="#4c7a66" stroke-width="3" stroke-linecap="round"/>
  <g fill="#263e37" font-family="Arial,sans-serif">
    <text x="92" y="56" font-size="19" font-weight="700">BIÊN NHẬN ĐẶT CỌC</text>
    <text x="48" y="111" font-size="15">Người thanh toán</text><text x="332" y="111" font-size="15" font-weight="700">Vy</text>
