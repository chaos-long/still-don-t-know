  <path d="M180 334 Q190 340 200 334" stroke="#874e3a" stroke-width="2" fill="none"/>
  <path d="M144 298 Q154 255 190 255 Q235 255 238 290 C228 275 210 270 190 270 C168 270 154 280 144 298 Z" fill="#201b18"/>

